name: GitOps CI/CD Pipeline

on:
  push:
    branches:
      - main
    # We ignore changes to the charts folder so the bot pushing updates doesn't trigger an infinite loop
    paths-ignore:
      - 'charts/**'

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Pull your code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Log into your Docker Hub account
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build the new image and push it. 
      # We use github.sha (a unique ID for every commit) as the tag so every build is distinct.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: mshaan/groww:${{ github.sha }}

      # 4. Find the values.yaml file and replace the old tag with the new unique commit ID
      - name: Update Helm Chart values.yaml
        run: |
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' charts/login-app-chart/values.yaml

      # 5. Commit the updated values.yaml back to your repository so Argo CD can see it
      - name: Commit and Push Changes to Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/login-app-chart/values.yaml
          git commit -m "Auto-update image tag to ${{ github.sha }}"
          git push