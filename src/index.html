<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-root">
        <!-- Login Form -->
        <form id="loginForm" class="card">
            <h2>Sign In</h2>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn">Login</button>
            <p class="footer-text">Don't have an account? <a href="#" onclick="toggleForms()">Sign up</a></p>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" class="card" style="display: none;">
            <h2>Register</h2>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="signup-email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="signup-password" required>
            </div>
            <button type="submit" class="btn">Sign Up</button>
            <p class="footer-text">Already have an account? <a href="#" onclick="toggleForms()">Sign in</a></p>
        </form>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-content">
            <div class="success-icon">&#10004;</div>
            <h2>Awesome!</h2>
            <p id="modal-message">Your account has been created successfully.</p>
            <button onclick="closeModal()" class="btn modal-btn">Continue to Login</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
